name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - dev
  push:
    branches:
      - main
      - master
      - dev

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3003/api
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: hyperdata-production
      cancel-in-progress: false
    steps:
      - name: Configure Netcup SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.NETCUP_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "${{ secrets.NETCUP_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Deploy frontend
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_PORT: ${{ secrets.NETCUP_PORT || '22' }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
        run: |
          ssh -p "$NETCUP_PORT" "$NETCUP_USER@$NETCUP_HOST" \
            '/home/deploy/hyperdata/src/hyperdata-backend/deploy/deploy.sh frontend'
